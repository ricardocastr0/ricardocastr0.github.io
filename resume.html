<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Ricardo Castro</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="resume">
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <h1>Resume</h1>
      <p>View or download my resume below.</p>

      <div class="cta">
        <a
          class="btn primary"
          href="assets/resume/resume.pdf"
          target="_blank"
          rel="noopener"
        >
          Open PDF
        </a>
        <a
          class="btn"
          href="assets/resume/resume.pdf"
          download
        >
          Download
        </a>
      </div>
    </section>

    <section class="section">
      <div class="pdf-wrap">
        <iframe
          class="pdf"
          src="assets/resume/resume.pdf"
          title="Ricardo Castro Resume"
        ></iframe>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="include.js"></script>
</body>
</html>
