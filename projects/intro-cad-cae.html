<script>
const PAGE = {

  classLabel: "Class Project",
  classTitle: "Intro to CAD/CAE Tools",
  classNumber: "24-688",
  title: "Hitch-Mounted Bike Carrier",
  subtitle: "FEA found the failure point. Material strategy cut two-thirds of the weight.",
  meta: [
    { label: "Course",   value: "24-688 Introduction to CAD and CAE Tools" },
    { label: "Role",     value: "Team of 4 — concept lead, FEA, materials" },
    { label: "Target",   value: "Volume production, 45,000 units" },
    { label: "Timeline", value: "Fall 2025" }
  ],

  hero: {
    type: "empty",
    src: "../media/bike-carrier-render.png",
    poster: "",
    note: "Best hero: the final CAD render of the folded rack on a vehicle (from your slide deck). Landscape aspect ratio."
  },

  sections: [
    {
      heading: "Context",
      body: "Client brief was straightforward — a two-bike hitch-mounted rack, foldable for storage, quick to install and remove, compatible with multiple bike sizes, and buildable at 45,000-unit volume. The design space is crowded, so the differentiator wasn't going to be capacity or feature count. It was going to be whether the structure held up under load without dragging the weight up into a range that made installation a two-person job.",
      media: null
    },
    {
      heading: "Constraints",
      body: "Standard 2-inch receiver hitch geometry. Two full-size bikes worth of static and dynamic load through the connection to the vehicle. A cost buildup that had to close at volume, which meant favoring automated processes (CNC, tube bending, robotic welding) over hand fabrication. And a folded footprint small enough that the rack could actually live in a garage between trips rather than staying bolted to the car.",
      media: {
        type: "empty",
        src: "../media/bike-carrier-concepts.png",
        caption: "Concept sketches — four candidate approaches evaluated against the brief.",
        note: "The four hand-sketched concepts from the slide deck. Recruiters like seeing that concept sketches happened, not just the final CAD."
      }
    },
    {
      heading: "Approach",
      body: "Selected a foldable platform-tray concept from four candidates against install ease, bike-size compatibility, and folded footprint. Static stress FEA on the initial design located a choke point at the hitch connection — a stress concentration at the edge between the main hitch and the connection joint where the geometry couldn't distribute load smoothly. Iterated the geometry: added support prongs to increase surface-area contact at the connection, reinforced the wheel-cradle arms. Then attacked the mass problem via material strategy — aluminum on everything except the hitch joint, where steel stays for the load path that matters most. Closed with a DFM plan mapping each subassembly to a specific process: CNC for the shank/support tube/joint, tube bending for the wheel cradles and frame hooks, robotic welding for the main hitch assembly.",
      media: {
        type: "empty",
        src: "../media/bike-carrier-fea.png",
        caption: "Von Mises stress plot after material change. Safety factor holds at 2.465.",
        note: "The FEA safety-factor plot from the slide deck (the one with the color legend and Min 2.465 callout)."
      }
    },
    {
      heading: "Results",
      body: "Total assembly mass dropped from 80.2 kg to 27.6 kg — a 66% reduction — while the safety factor stayed in the target range (2.465 minimum after the material change). The choke point identified in the initial FEA was resolved by the geometry revision and the strategic material change, with the residual load path staying in steel where it matters. The DFM plan closed with a per-unit cost buildup for the 45,000-unit production run, mapping raw material, fabrication, powder coating, and assembly to processes with realistic quotes.",
      media: {
        type: "empty",
        src: "../media/bike-carrier-final.png",
        caption: "Final assembly, folded position — mounted to the vehicle.",
        note: "The final rendered image showing the rack mounted on the car (from the slide deck)."
      }
    }
  ],

  stack: {
    "CAD":           ["Fusion 360", "Parametric modeling", "Assembly design"],
    "Simulation":    ["Static stress FEA", "Von Mises", "Safety-factor analysis"],
    "Manufacturing": ["CNC machining", "Tube bending", "Robotic welding"],
    "Design":        ["DFM/DFA", "Cost estimation", "Concept evaluation matrix"]
  },

  takeaway: "The interesting decision on this project wasn't the initial design — it was refusing to solve the failure at the choke point with more material everywhere. Steel is easy; aluminum plus a targeted steel reinforcement at the load path forces you to actually understand where the stress goes. The 66% weight reduction wasn't the goal, it was the byproduct of that choice.",

  links: [],

  backHref: "../index.html",
  backLabel: "← Back to site"
};
</script>

<div class="wrap">
  <div class="top"><a class="back" href="" id="j-back-top"></a></div>
  <header class="hero">
    <div class="eyebrow" id="j-category"></div>

    <div class="metablock" id="j-meta"></div>

    <div class="sec-head"><h2>Stack</h2><span class="line"></span></div>
    <div class="stack" id="j-stack"></div>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>Takeaway</h2><span class="line"></span></div>
    <div class="takeaway">
      <span class="takeaway-label">In one paragraph</span>
      <p id="j-takeaway"></p>
    </div>
    <ul class="linksout" id="j-linksout"></ul>
  </section>

    <a class="foot-back" href="" id="j-back-foot"></a>
    <span class="eyebrow">Ricardo Castro</span>
  </footer>
</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);
  document.title = PAGE.classTitle + " (" + PAGE.classNumber + ") — Ricardo Castro";
  $("j-category").textContent = PAGE.classLabel + " · " + PAGE.classNumber + " " + PAGE.classTitle;
  $("j-title").textContent = PAGE.title;
  $("j-sub").textContent = PAGE.subtitle;
  $("j-takeaway").textContent = PAGE.takeaway;
  $("j-back-top").href = PAGE.backHref;
  $("j-back-top").textContent = PAGE.backLabel;
  $("j-back-foot").href = PAGE.backHref;
  $("j-back-foot").textContent = PAGE.backLabel;
  $("j-meta").innerHTML = PAGE.meta.map(m =>
    `<div class="mb-cell"><span class="mb-label">${esc(m.label)}</span><span class="mb-value">${esc(m.value)}</span></div>`
  ).join("");
  function mediaHTML(m, klass){
    const cls = "frame " + klass;
    if(!m || m.type === "empty"){
      return `<div class="${cls}"><div class="frame-empty">
        <span class="fe-tag">Media slot — empty</span>
        <span class="fe-note">${esc(m ? m.note : "")}</span>
        <span class="fe-path">${esc(m ? m.src : "")}</span>
      </div></div>`;
    }
    if(m.type === "video"){
      return `<div class="${cls}"><video src="${esc(m.src)}" ${m.poster ? `poster="${esc(m.poster)}"` : ""} autoplay muted loop playsinline></video></div>`;
    }
    return `<div class="${cls}"><img src="${esc(m.src)}" alt="" loading="lazy"></div>`;
  }
  $("j-hero").innerHTML = mediaHTML(PAGE.hero, "frame-hero");
  $("j-sections").innerHTML = PAGE.sections.map(s => `
    <section class="sec">
      <div class="sec-head"><h2>${esc(s.heading)}</h2><span class="line"></span></div>
      <p>${esc(s.body)}</p>
      ${s.media ? mediaHTML(s.media, "frame-inline") + (s.media.caption ? `<p class="caption">${esc(s.media.caption)}</p>` : "") : ""}
    </section>
  `).join("");
  $("j-stack").innerHTML = Object.entries(PAGE.stack).map(([k, arr]) => `
    <div class="stack-row">
      <div class="stack-key">${esc(k)}</div>
      <div class="stack-val">${arr.map(esc).join(" · ")}</div>
    </div>
  `).join("");
  $("j-linksout").innerHTML = (PAGE.links || []).map(l =>
    `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`
  ).join("");
})();
</script>
