    {
      "label": "Course",
      "value": "24-688 Introduction to CAD and CAE Tools"
    },
    {
      "label": "Role",
      "value": "Team of 4 · concept lead, FEA, materials"
    },
    {
      "label": "Costing scenario",
      "value": "45,000 units · planning only"
    },
    {
      "label": "Timeline",
      "value": "Fall 2025"
    }
  ],
  "hero": {
    "type": "empty",
    "src": "../media/bike-carrier-render.png",
    "poster": "",
    "note": "Final CAD render of the rack mounted on a vehicle."

  "sections": [
    {
      "heading": "Context",
      "body": "The course brief called for a two-bike hitch rack that folds for storage, is easy to install and remove, and fits multiple bike sizes. Our team developed the design and a manufacturing cost estimate for a hypothetical 45,000-unit volume.",
      "media": null
    },
    {
      "heading": "Constraints",
      "body": "The rack had to fit a standard 2-inch receiver hitch and carry two full-size bikes. We considered static and dynamic loads, the folded storage footprint, and manufacturing cost. The manufacturing plan included CNC machining, tube bending, and robotic welding.",
      "media": {
        "type": "empty",
        "src": "../media/bike-carrier-concepts.png",
        "caption": "Concept sketches · four candidate approaches evaluated against the brief.",
        "note": "Four concept sketches with the selection criteria."
      }
    },
    {
      "heading": "Approach",
      "body": "We selected a folding platform-tray design from four concepts. Static FEA showed a stress concentration at the hitch connection. We added support prongs and reinforced the wheel-cradle arms, then used aluminum for most components while retaining steel at the hitch joint. The manufacturing plan assigned machining, tube bending, and welding processes to the subassemblies.",
      "media": {
        "type": "empty",
        "src": "../media/bike-carrier-fea.png",
        "caption": "FEA result: reported minimum safety factor 2.465 under the modeled conditions.",
        "note": "The FEA safety-factor plot from the slide deck (the one with the color legend and Min 2.465 callout)."
      }
    },
    {
      "heading": "Results",
      "body": "Reported assembly mass fell from 80.2 to 27.6 kg, a reduction of about 66%. The mass values still need to be identified as measured or CAD-estimated. The minimum FEA safety factor was 2.465 under the modeled conditions. These were design and simulation results. The 45,000-unit volume was a costing assumption.",
      "media": {
        "type": "empty",
        "src": "../media/bike-carrier-final.png",
        "caption": "Final assembly, folded position · mounted to the vehicle.",

      }

  ],
  "stack": {
    "CAD": [
      "Fusion 360",

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);
  document.title = PAGE.classTitle + " (" + PAGE.classNumber + ") · Ricardo Castro";
  $("j-category").textContent = PAGE.classLabel + " · " + PAGE.classNumber + " " + PAGE.classTitle;
  $("j-title").textContent = PAGE.title;
  $("j-sub").textContent = PAGE.subtitle;
  $("j-takeaway").textContent = PAGE.takeaway;
  $("j-back-top").href = PAGE.backHref;
  $("j-back-top").textContent = PAGE.backLabel;
  $("j-back-foot").href = PAGE.backHref;
  $("j-back-foot").textContent = PAGE.backLabel;
  $("j-meta").innerHTML = PAGE.meta.map(m =>
    `<div class="mb-cell"><span class="mb-label">${esc(m.label)}</span><span class="mb-value">${esc(m.value)}</span></div>`
  ).join("");
  function mediaHTML(m, klass){
    const cls = "frame " + klass;
    if(!m || m.type === "empty"){
      return `<div class="${cls}"><div class="frame-empty">
        <span class="fe-tag">Media to add</span>
        <span class="fe-note">${esc(m ? m.note : "")}</span>

      </div></div>`;
    }
    if(m.type === "video"){
      return `<div class="${cls}"><video src="${esc(m.src)}" ${m.poster ? `poster="${esc(m.poster)}"` : ""} controls playsinline preload="metadata"></video></div>`;
    }
    return `<div class="${cls}"><img src="${esc(m.src)}" alt="${esc(m.alt || m.note || PAGE.title)}" loading="lazy"></div>`;
  }
  $("j-hero").innerHTML = mediaHTML(PAGE.hero, "frame-hero");
  $("j-sections").innerHTML = PAGE.sections.map(s => `
    <section class="sec">
      <div class="sec-head"><h2>${esc(s.heading)}</h2><span class="line"></span></div>
      <p>${esc(s.body)}</p>
      ${s.media ? mediaHTML(s.media, "frame-inline") + (s.media.caption ? `<p class="caption">${esc(s.media.caption)}</p>` : "") : ""}
    </section>
  `).join("");
  $("j-stack").innerHTML = Object.entries(PAGE.stack).map(([k, arr]) => `
    <div class="stack-row">
      <div class="stack-key">${esc(k)}</div>
      <div class="stack-val">${arr.map(esc).join(" · ")}</div>
    </div>
  `).join("");
  $("j-linksout").innerHTML = (PAGE.links || []).map(l =>
    `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`
  ).join("");
})();
</script>
