const PAGE = {
  "classLabel": "Class Project",
  "classTitle": "Mechanical Design: Methods and Applications",
  "classNumber": "24-370",
  "title": "Motor-Controlled Scissors",
  "subtitle": "One-handed cutting for people with tendinitis.",
  "meta": [
    {
      "label": "Course",
      "value": "24-370 Mechanical Design: Methods and Applications"
    },
    {
      "label": "Focus",
      "value": "Accessibility-driven product design"
    },
    {
      "label": "Control",
      "value": "PID, tuned in MATLAB/Simulink"
    },
    {
      "label": "Type",
      "value": "Course prototype"
    }
  ],
  "hero": {
    "type": "image",
    "src": "../media/scissors.png",
    "poster": "",
    "note": "Photo of the built device, ideally in use. A Simulink step-response plot works as a second image."
  },
  "sections": [
    {
      "heading": "Context",
      "body": "A motor-driven scissor prototype designed for one-handed cutting. The goal was to reduce strain during repetitive cutting for people with tendinitis.",
      "media": null
    },
    {
      "heading": "Approach",
      "body": "The cutting system was modeled in MATLAB and Simulink to tune PID gains under ramp inputs. The controller was then implemented and tested on Arduino. Design considerations included blade closure under different material loads and interruptions during a cut.",
      "media": null
    },
    {
      "heading": "Evidence to add",
      "body": "The test setup, blade-response data, and individual team responsibilities still need to be added.",
      "media": {
        "type": "empty",
        "src": "../media/scissors-response.png",
        "note": "Controller response · label input, output, units, cutting load, and whether the plot is simulated or measured."
      }
    }
  ],
  "stack": {
    "Control": [
      "MATLAB",
      "Simulink",
      "PID tuning"
    ],
    "Hardware": [
      "Arduino"
    ],
    "Design": [
      "Design for accessibility",
      "Ergonomics"
    ]
  },
  "takeaway": "The project used MATLAB/Simulink modeling and Arduino control to operate a cutting mechanism. Reduced strain was a design goal; a measured ergonomic benefit has not been established.",
  "links": [],
  "backHref": "../index.html",
  "backLabel": "← Back to site"
};
</script>

<div class="wrap">

    <div class="eyebrow" id="j-category"></div>

  </header>
  <main id="j-sections"></main>
  <section class="sec">

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);
  document.title = PAGE.classTitle + " (" + PAGE.classNumber + ") · Ricardo Castro";
  $("j-category").textContent = PAGE.classLabel + " · " + PAGE.classNumber + " " + PAGE.classTitle;
  $("j-title").textContent = PAGE.title;
  $("j-sub").textContent = PAGE.subtitle;
  $("j-back-top").href = PAGE.backHref;
  $("j-back-top").textContent = PAGE.backLabel;
  $("j-back-foot").href = PAGE.backHref;
  $("j-back-foot").textContent = PAGE.backLabel;
  if (!PAGE.takeaway) { $("j-takeaway-sec").style.display = "none"; }
  else { $("j-takeaway").textContent = PAGE.takeaway; }
  $("j-meta").innerHTML = PAGE.meta.map(m =>
    `<div class="mb-cell"><span class="mb-label">${esc(m.label)}</span><span class="mb-value">${esc(m.value)}</span></div>`
  ).join("");
  function mediaHTML(m, klass){
    const cls = "frame " + klass;
    if(!m || m.type === "empty"){
      return `<div class="${cls}"><div class="frame-empty">
        <span class="fe-tag">Media to add</span>
        <span class="fe-note">${esc(m ? m.note : "")}</span>

      </div></div>`;
    }
    if(m.type === "video"){
      return `<div class="${cls}"><video src="${esc(m.src)}" ${m.poster ? `poster="${esc(m.poster)}"` : ""} controls playsinline preload="metadata"></video></div>`;
    }
    return `<div class="${cls}"><img src="${esc(m.src)}" alt="${esc(m.alt || m.note || PAGE.title)}" loading="lazy"></div>`;
  }
  $("j-hero").innerHTML = mediaHTML(PAGE.hero, "frame-hero");
  $("j-sections").innerHTML = PAGE.sections.map(s => `
    <section class="sec">
      <div class="sec-head"><h2>${esc(s.heading)}</h2><span class="line"></span></div>
      <p>${esc(s.body)}</p>
      ${s.media ? mediaHTML(s.media, "frame-inline") + (s.media.caption ? `<p class="caption">${esc(s.media.caption)}</p>` : "") : ""}
    </section>
  `).join("");
  $("j-stack").innerHTML = Object.entries(PAGE.stack).map(([k, arr]) => `
    <div class="stack-row">
      <div class="stack-key">${esc(k)}</div>
      <div class="stack-val">${arr.map(esc).join(" · ")}</div>
    </div>
  `).join("");
  $("j-linksout").innerHTML = (PAGE.links || []).map(l =>
    `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`
  ).join("");
})();
</script>
