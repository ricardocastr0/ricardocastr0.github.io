<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Design: Methods and Applications (24-370) — Ricardo Castro</title>
<meta name="description" content="Class project from CMU 24-370 Mechanical Design: Methods and Applications — a motor-controlled, one-handed pair of scissors for accessibility.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nav.css">
<link rel="stylesheet" href="../subpage.css">
</head>
<body>
<script>window.NAV_BASE = "../";</script>
<div id="site-nav"></div>

<!-- ============================================================= -->
<!--  EDIT ZONE                                                    -->
<!-- ============================================================= -->
<script>
const PAGE = {

  classLabel: "Class Project",
  classTitle: "Mechanical Design: Methods and Applications",
  classNumber: "24-370",
  title: "Motor-Controlled Scissors",
  subtitle: "One-handed cutting for people with tendinitis.",
  meta: [
    { label: "Course",   value: "24-370 Mechanical Design: Methods and Applications" },
    { label: "Focus",    value: "Accessibility-driven product design" },
    { label: "Control",  value: "PID, tuned in MATLAB/Simulink" },
    { label: "Timeline", value: "TBD" }
  ],

  hero: {
    type: "image",
    src: "../media/scissors.png",
    poster: "",
    note: "Photo of the built device, ideally in use. A Simulink step-response plot works as a second image."
  },

  sections: [
    {
      heading: "Context",
      body: "An electromechanical scissor system built to reduce joint strain during repetitive cutting, aimed at people with tendinitis. The design problem was as much ergonomic as it was control — accessibility drove the form factor from the start, not something bolted on after the mechanism was decided.",
      media: null
    },
    {
      heading: "Approach",
      body: "Modeled the cutting system in MATLAB and Simulink to tune PID gains under ramp inputs, then implemented and validated the controller on Arduino. The constraint that shaped the control design was consistent blade closure across varying material loads and user-triggered interruptions mid-cut — the system had to behave predictably even when the person using it changed their mind partway through a cut.",
      media: null
    }
  ],

  stack: {
    "Control":  ["MATLAB", "Simulink", "PID tuning"],
    "Hardware": ["Arduino"],
    "Design":   ["Design for accessibility", "Ergonomics"]
  },

  takeaway: "",

  links: [],

  backHref: "../index.html",
  backLabel: "← Back to site"
};
</script>

<!-- ============================================================= -->
<!--  STOP.                                                        -->
<!-- ============================================================= -->

<div class="wrap">
  <div class="top"><a class="back" href="" id="j-back-top"></a></div>
  <header class="hero">
    <div class="eyebrow" id="j-category"></div>
    <h1 id="j-title"></h1>
    <p class="hero-sub" id="j-sub"></p>
    <div class="metablock" id="j-meta"></div>
    <div id="j-hero"></div>
  </header>
  <main id="j-sections"></main>
  <section class="sec">
    <div class="sec-head"><h2>Stack</h2><span class="line"></span></div>
    <div class="stack" id="j-stack"></div>
  </section>
  <section class="sec" id="j-takeaway-sec">
    <div class="sec-head"><h2>Takeaway</h2><span class="line"></span></div>
    <div class="takeaway">
      <span class="takeaway-label">In one paragraph</span>
      <p id="j-takeaway"></p>
    </div>
    <ul class="linksout" id="j-linksout"></ul>
  </section>
  <footer>
    <a class="foot-back" href="" id="j-back-foot"></a>
    <span class="eyebrow">Ricardo Castro</span>
  </footer>
</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);
  document.title = PAGE.classTitle + " (" + PAGE.classNumber + ") — Ricardo Castro";
  $("j-category").textContent = PAGE.classLabel + " · " + PAGE.classNumber + " " + PAGE.classTitle;
  $("j-title").textContent = PAGE.title;
  $("j-sub").textContent = PAGE.subtitle;
  $("j-back-top").href = PAGE.backHref;
  $("j-back-top").textContent = PAGE.backLabel;
  $("j-back-foot").href = PAGE.backHref;
  $("j-back-foot").textContent = PAGE.backLabel;
  if (!PAGE.takeaway) { $("j-takeaway-sec").style.display = "none"; }
  else { $("j-takeaway").textContent = PAGE.takeaway; }
  $("j-meta").innerHTML = PAGE.meta.map(m =>
    `<div class="mb-cell"><span class="mb-label">${esc(m.label)}</span><span class="mb-value">${esc(m.value)}</span></div>`
  ).join("");
  function mediaHTML(m, klass){
    const cls = "frame " + klass;
    if(!m || m.type === "empty"){
      return `<div class="${cls}"><div class="frame-empty">
        <span class="fe-tag">Media slot — empty</span>
        <span class="fe-note">${esc(m ? m.note : "")}</span>
        <span class="fe-path">${esc(m ? m.src : "")}</span>
      </div></div>`;
    }
    if(m.type === "video"){
      return `<div class="${cls}"><video src="${esc(m.src)}" ${m.poster ? `poster="${esc(m.poster)}"` : ""} autoplay muted loop playsinline></video></div>`;
    }
    return `<div class="${cls}"><img src="${esc(m.src)}" alt="" loading="lazy"></div>`;
  }
  $("j-hero").innerHTML = mediaHTML(PAGE.hero, "frame-hero");
  $("j-sections").innerHTML = PAGE.sections.map(s => `
    <section class="sec">
      <div class="sec-head"><h2>${esc(s.heading)}</h2><span class="line"></span></div>
      <p>${esc(s.body)}</p>
      ${s.media ? mediaHTML(s.media, "frame-inline") + (s.media.caption ? `<p class="caption">${esc(s.media.caption)}</p>` : "") : ""}
    </section>
  `).join("");
  $("j-stack").innerHTML = Object.entries(PAGE.stack).map(([k, arr]) => `
    <div class="stack-row">
      <div class="stack-key">${esc(k)}</div>
      <div class="stack-val">${arr.map(esc).join(" · ")}</div>
    </div>
  `).join("");
  $("j-linksout").innerHTML = (PAGE.links || []).map(l =>
    `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`
  ).join("");
})();
</script>

<script src="../nav.js"></script>

</body>
</html>
