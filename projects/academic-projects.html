<script>
const PAGE = {
  "classLabel": "Academic Projects",
  "title": "Academic Projects",
  "subtitle": "Design and leadership work carried out through CMU-affiliated projects and organizations, outside of coursework.",
  "meta": [
    {
      "label": "Scope",
      "value": "Sponsored design, campus leadership"
    },
    {
      "label": "School",
      "value": "Carnegie Mellon University"
    }
  ],
  "projects": [
    {
      "id": "rethink-the-rink",
      "title": "Rethink the Rink",
      "meta": "CMU × Covestro × Pittsburgh Penguins · 2024 & 2025",
      "body": "I led material selection, CAD modeling, and prototyping for two Covestro-sponsored safety challenges. Our teams developed protective glove and neck guard concepts with Covestro engineers and the Pittsburgh Penguins. The 2024 challenge focused on a neck guard and the 2025 challenge on gloves. We explored layered materials for impact protection and range of motion, then presented our findings to the sponsors in 2024 and 2025.",
      "details": [
        {
          "body": "For the 2025 gloves challenge, I identified palm degradation, limited wrist protection, and bulky backhand padding in current hockey gloves. I sourced data on injury rates, glove replacement costs, and youth-to-pro needs, then engineered a multilayer system using Texin 983A TPU, Dyneema mesh, and Bayflex 8868 foam. Impact force calculations for a 10 kN puck hit and stress-thickness simulations guided material choice and geometry. I designed lightweight, articulated segments that preserved wrist range of motion for youth and professional athletes, and helped fabricate palm and wrist prototypes. I was recognized as Team MVP for leadership, concept development, and prototyping."
        },
        {
          "body": "For the 2024 neck guard challenge, I led the initial research, reviewing existing neck protection technologies and interviewing the Penguins' medical and equipment staff. I created multiple SolidWorks iterations to optimize flexibility and impact resistance, ran FEA simulations for stress distribution and high-speed impact resistance without sacrificing mobility, and experimented with high-density foams and flexible polymers to balance protection and comfort. Our team produced a working prototype in four days using machine shop resources, including 3D printing and laser cutting. A panel from the Penguins, Covestro, and Bauer Hockey awarded it Most Innovative Design."
        }
      ],
      "spec": {
        "value": "2 awards",
        "label": "Most Innovative Design 2024 · Team MVP 2025"
      },
      "stack": [
        "Material selection",
        "Prototyping",
        "SolidWorks",
        "Impact testing"
      ],
      "hero": {
        "type": "image",
        "src": "../media/rink.png",
        "note": "Rethink the Rink prototype and project team."
      }
    },
    {
      "id": "greek-sing-sets",
      "title": "Greek Sing Sets",
      "meta": "Phi Delta Theta, CMU · Two productions · Sets Chair",
      "body": "Greek Sing is Carnegie Mellon's largest student-run performance event, where fraternity and sorority pairs produce fully staged 12 to 15 minute musicals. I have served as Sets Chair for two Greek Sing shows at CMU, leading the design, construction, and backstage deployment of the sets. These student musicals gave me a reason to build large structures for a creative purpose, while learning to work with wood and fabrication tools that were new to me. Across both productions, the work included a 20 by 12 foot stage set with functional doors, layered platforms, and integrated automation for 40+ performers, with a 30+ person build crew across six production milestones.",
      "details": [
        {
          "body": "The work included a modular staircase and a spiral staircase. With limited fabrication experience and a short build window, I had to learn the tools while helping turn the design into a structure the production could use. I worked in SolidWorks and produced fabrication drawings, then took part in the hands-on build using jigsaws, miter saws, circular saws, and bore bits."
        },
        {
          "body": "The work depended on communication with the music, script, and choreography teams. Their needs shaped the set, and I coordinated how the pieces would be moved and used backstage. I also wrote a transition report for the next chair. The 2025 sets were smaller, built with a more constricted budget."
        }
      ],
      "spec": null,
      "stack": [
        "SolidWorks",
        "Technical drawings",
        "Wood fabrication",
        "Budgeting and purchasing",
        "Crew coordination",
        "Stage logistics"
      ],
      "hero": null
    },
    {
      "id": "booth-committee",
      "title": "Spring Carnival Booth",
      "meta": "CMU Spring Carnival · Booth Committee",
      "body": "Spring Carnival Booth gave me another opportunity to learn woodworking and build at a larger scale. I helped with construction and decoration, worked from technical drawings, and troubleshot attachment points during assembly. I also contributed load-bearing calculations on a two-story structure and trained newer members on safe assembly.",
      "spec": null,
      "stack": [
        "Fabrication",
        "Technical drawing reading",
        "Attachment/assembly troubleshooting"
      ],
      "hero": null,
      "details": [
        {
          "body": "Working with the team meant connecting practical construction decisions with a creative design. I was learning unfamiliar tools and materials while collaborating on a structure whose purpose went beyond an engineering assignment."
        }
      ]
    }
  ],
  "backHref": "../index.html",
  "backLabel": "← Back to site"
};
</script>

<div class="wrap">
  <div class="top"><a class="back" href="" id="j-back-top"></a></div>

    <div class="eyebrow" id="j-category"></div>

    <p class="hero-sub" id="j-sub"></p>
    <div class="metablock" id="j-meta"></div>
  </header>
  <main id="j-projects"></main>
  <footer>
    <a class="foot-back" href="" id="j-back-foot"></a>
    <span class="eyebrow">Ricardo Castro</span>
  </footer>
</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);
  document.title = PAGE.title + " · Ricardo Castro";
  $("j-category").textContent = PAGE.classLabel;
  $("j-title").textContent = PAGE.title;
  $("j-sub").textContent = PAGE.subtitle;
  $("j-back-top").href = PAGE.backHref;
  $("j-back-top").textContent = PAGE.backLabel;
  $("j-back-foot").href = PAGE.backHref;
  $("j-back-foot").textContent = PAGE.backLabel;
  $("j-meta").innerHTML = PAGE.meta.map(m =>
    `<div class="mb-cell"><span class="mb-label">${esc(m.label)}</span><span class="mb-value">${esc(m.value)}</span></div>`
  ).join("");

  function mediaHTML(m){
    if(!m) return "";
    if(m.type === "empty"){
      return `<div class="frame frame-inline"><div class="frame-empty">
        <span class="fe-tag">Media to add</span>
        <span class="fe-note">${esc(m ? m.note : "")}</span>

      </div></div>`;
    }
    if(m.type === "video"){
      return `<div class="frame frame-inline"><video src="${esc(m.src)}" controls playsinline preload="metadata"></video></div>`;
    }
    return `<div class="frame frame-inline"><img src="${esc(m.src)}" alt="${esc(m.alt || m.note || PAGE.title)}" loading="lazy"></div>`;
  }

  $("j-projects").innerHTML = PAGE.projects.map(p => `
    <section class="proj-block" id="${esc(p.id)}">
      ${p.id === "greek-sing-sets" ? "<!-- TODO: add pictures of the 2024 sets later (photos intentionally hidden for now). -->" : ""}
      <h2>${esc(p.title)}</h2>
      <p class="proj-meta-line">${esc(p.meta)}</p>
      <p class="proj-body">${esc(p.body)}</p>
      ${(p.details || []).map(d => `<div class="proj-detail">${d.heading ? `<h3>${esc(d.heading)}</h3>` : ""}<p class="proj-body">${esc(d.body)}</p></div>`).join("")}
      ${p.spec ? `<div class="stack-row"><div class="stack-key">${esc(p.spec.label)}</div><div class="stack-val">${esc(p.spec.value)}</div></div>` : ""}
      ${mediaHTML(p.hero)}
      <div class="stack-row"><div class="stack-key">Stack</div><div class="stack-val">${p.stack.map(esc).join(" · ")}</div></div>
    </section>
  `).join("");
})();
</script>
