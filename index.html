  hubs: [

      title: "Bigfoot",

<style>
:root{
  --paper:#E6EAEC;
  --paper-2:#DCE1E4;
  --ink:#15181B;
  --ink-2:#4A5257;
  --rule:#A9B3B9;
  --blue:#1B4FD1;
  --stress:#D93B16;
  --card:#F2F4F5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:17px;
  line-height:1.62;
  background-image:linear-gradient(var(--paper-2) 1px,transparent 1px),linear-gradient(90deg,var(--paper-2) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px}

.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ---- hero ---- */
.hero{padding:56px 0 40px}
.hero-name{
  font-family:"Archivo",system-ui,sans-serif;
  font-variation-settings:"wdth" 112,"wght" 800;
  font-weight:800;
  font-size:clamp(48px,11.5vw,116px);
  line-height:.9;letter-spacing:-.03em;
  margin:14px 0 0;text-transform:uppercase;
}
.hero-rule{height:2px;background:var(--ink);margin:26px 0 0}
.titleblock{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--rule);border-top:none;
}
.tb-cell{padding:11px 13px;border-right:1px solid var(--rule);min-width:0}
.tb-cell:last-child{border-right:none}
.tb-label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:3px;
}
.tb-value{font-size:14px;font-weight:500;line-height:1.35}
.thesis{
  max-width:60ch;margin:34px 0 0;font-size:clamp(18px,2.3vw,21px);
  line-height:1.55;color:var(--ink);
}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 0;padding:0;list-style:none}
.links a{
  display:inline-block;padding:9px 16px;border:1.5px solid var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;background:transparent;
  transition:background .16s ease,color .16s ease;
}
.links a:hover{background:var(--ink);color:var(--paper)}

/* ---- section heads ---- */
.sec{padding:56px 0 0;scroll-margin-top:24px}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:30px}
.sec-head h2{
  font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 108,"wght" 700;
  font-size:clamp(22px,3.4vw,30px);margin:0;letter-spacing:-.01em;text-transform:uppercase;
}
.sec-head .line{flex:1;height:1px;background:var(--rule)}
.sec-intro{max-width:70ch;font-size:16.5px;color:var(--ink);margin:-12px 0 26px}

/* ---- about / contact ---- */
.prose{max-width:68ch;font-size:16.5px;line-height:1.65;margin:0}

/* ---- experience / leadership rows ---- */
.exp{display:flex;flex-direction:column;gap:0}
.exp-row{
  display:grid;grid-template-columns:280px 1fr;gap:24px;
  padding:18px 0;border-bottom:1px solid var(--rule);
}
.exp-row:first-child{border-top:1px solid var(--rule)}
.exp-role{margin:0;font-weight:600;font-size:15.5px}
.exp-org{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.exp-note{margin:0;font-size:15px;color:var(--ink)}
.exp-row.featured{background:var(--card)}
.exp-row.featured .exp-role{color:var(--stress)}
.exp-link{
  display:inline-block;margin-top:8px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;color:var(--stress);
}
.exp-link:hover{text-decoration:underline}

/* ---- project hubs ---- */
.hubs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.hub{border:1px solid var(--rule);background:var(--card);padding:24px}
.hub h3{
  font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 108,"wght" 700;
  font-size:20px;margin:10px 0 10px;letter-spacing:-.01em;text-transform:uppercase;
}
.hub p{margin:0 0 16px;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.hub-links{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.hub-links a{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.03em;
  text-decoration:none;color:var(--ink);border-bottom:1px solid var(--rule);
  padding-bottom:6px;display:block;
}
.hub-links a:hover{color:var(--stress);border-color:var(--stress)}

/* ---- capabilities ---- */
.cap-row{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:14px 0;border-bottom:1px solid var(--rule)}
.cap-row:first-child{border-top:1px solid var(--rule)}
.cap-items{margin:0;font-size:15px}

footer{margin-top:64px;border-top:2px solid var(--ink);padding:22px 0 56px}
.foot-note{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);letter-spacing:.02em}

@media (max-width:820px){
  body{font-size:16px}
  .titleblock{grid-template-columns:repeat(2,1fr)}
  .tb-cell{border-bottom:1px solid var(--rule)}
  .tb-cell:nth-child(2){border-right:none}
  .tb-cell:nth-child(3),.tb-cell:nth-child(4){border-bottom:none}
  .tb-cell:nth-child(4){border-right:none}
  .exp-row{grid-template-columns:1fr;gap:6px}
  .cap-row{grid-template-columns:1fr;gap:6px}
  .hubs{grid-template-columns:1fr}
  .hero{padding:44px 0 30px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

<div class="wrap">

  <header class="hero">
    <div class="eyebrow" id="j-eyebrow"></div>
    <h1 class="hero-name" id="j-name"></h1>
    <div class="hero-rule"></div>
    <div class="titleblock" id="j-titleblock"></div>
    <p class="thesis" id="j-thesis"></p>
    <ul class="links" id="j-links"></ul>
  </header>

  <section class="sec" id="about">
    <div class="sec-head"><h2>About</h2><span class="line"></span></div>
    <p class="prose" id="j-about"></p>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Experience</h2><span class="line"></span></div>
    <div class="exp" id="j-exp"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Leadership</h2><span class="line"></span></div>
    <div class="exp" id="j-lead"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Projects</h2><span class="line"></span></div>
    <div class="hubs" id="j-hubs"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Capabilities</h2><span class="line"></span></div>
    <div id="j-cap"></div>
  </section>

  <section class="sec" id="contact">
    <div class="sec-head"><h2>Contact</h2><span class="line"></span></div>
    <p class="prose" id="j-contact"></p>
    <ul class="links" id="j-links-2"></ul>
  </section>

  <footer>
    <div class="foot-note" id="j-foot"></div>
  </footer>

</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s);
  const $ = id => document.getElementById(id);

  document.title = SITE.name + " — Mechanical Engineering & Robotics";
  $("j-eyebrow").textContent = "Portfolio";
  $("j-name").textContent = SITE.name;
  $("j-thesis").textContent = SITE.thesis;
  $("j-about").textContent = SITE.about.body;
  $("j-contact").textContent = SITE.contact.body;
  $("j-foot").textContent = SITE.footerNote;

  $("j-titleblock").innerHTML = SITE.titleBlock.map(c =>
    `<div class="tb-cell"><span class="tb-label">${esc(c.label)}</span><span class="tb-value">${esc(c.value)}</span></div>`
  ).join("");

  const linksHTML = SITE.links.map(l => `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`).join("");
  $("j-links").innerHTML = linksHTML;
  $("j-links-2").innerHTML = linksHTML;

  function rowsHTML(rows){
    return rows.map(e => `
      <div class="exp-row${e.featured ? " featured" : ""}">
        <div>
          <p class="exp-role">${esc(e.role)}</p>
          <p class="exp-org">${esc(e.org)}${e.date ? " · " + esc(e.date) : ""}</p>
        </div>
        <div>
          <p class="exp-note">${esc(e.note)}</p>
          ${e.href ? `<a class="exp-link" href="${esc(e.href)}">${e.featured ? "Read the full case study →" : "More →"}</a>` : ""}
        </div>
      </div>
    `).join("");
  }
  $("j-exp").innerHTML = rowsHTML(SITE.experience);
  $("j-lead").innerHTML = rowsHTML(SITE.leadership);

  $("j-hubs").innerHTML = SITE.hubs.map(h => `
    <article class="hub">
      <div class="eyebrow">${esc(h.eyebrow)}</div>
      <h3>${esc(h.title)}</h3>
      <p>${esc(h.body)}</p>
      <ul class="hub-links">${h.links.map(l => `<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`).join("")}</ul>
    </article>
  `).join("");

  $("j-cap").innerHTML = SITE.capabilities.map(c => `
    <div class="cap-row">
      <div class="eyebrow">${esc(c.group)}</div>
      <p class="cap-items">${esc(c.items)}</p>
    </div>
  `).join("");
})();
</script>
